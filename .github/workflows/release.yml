name: Publish PHP SDK release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/validate-release.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: python3 scripts/build-release.py --version "${GITHUB_REF_NAME#v}"
      - name: Test extracted bundle
        run: |
          unzip -q "dist/jurono-sdk-php-${GITHUB_REF_NAME#v}.zip" -d /tmp/jurono-release
          cd "/tmp/jurono-release/jurono-sdk-php-${GITHUB_REF_NAME#v}"
          php tests/run.php
          php tests/http.php
          python3 scripts/generate.py --check
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
            --verify-tag --title "Jurono PHP SDK $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
